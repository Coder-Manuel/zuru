name: zuru
description: "Zuru World — unified Client + Scout app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # ── State management & DI ─────────────────────────────────────────────────
  get: ^4.7.3
  get_storage: ^2.1.1

  # ── Networking ────────────────────────────────────────────────────────────
  dio: ^5.9.2

  # ── Functional programming ────────────────────────────────────────────────
  dartz: ^0.10.1

  # ── Backend ───────────────────────────────────────────────────────────────
  supabase_flutter: ^2.12.2

  # ── Firebase ──────────────────────────────────────────────────────────────
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3
  firebase_crashlytics: ^5.1.0

  # ── Auth ──────────────────────────────────────────────────────────────────
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1

  # ── UI ────────────────────────────────────────────────────────────────────
  pinput: ^6.0.2
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  dropdown_button2: ^2.3.9
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  infinite_scroll_pagination: ^4.1.0

  # ── Utils ─────────────────────────────────────────────────────────────────
  intl: ^0.20.2
  url_launcher: ^6.3.2
  observe_internet_connectivity: ^1.0.2
  geolocator: ^13.0.2

  # ── Analytics ─────────────────────────────────────────────────────────────
  mixpanel_flutter: ^2.5.0

  # ── Maps ──────────────────────────────────────────────────────────────────
  # Client role: location picker uses Google Maps
  google_maps_flutter: ^2.10.0

  # ── Streaming ─────────────────────────────────────────────────────────────
  livekit_client: ^2.2.0

  # ── Navigation (Scout role only) ──────────────────────────────────────────
  # Requires Android minSdk 26+. Pinned to v1.0.0 — do not upgrade without testing.
  flutter_mapbox_navigation_plus:
    git:
      url: https://github.com/Coder-Manuel/flutter_mapbox_navigation_plus.git
      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
